<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Benchmark · COA Assistent</title>
    <link rel="stylesheet" href="/assets/site.css?v=20261119" />
    <link rel="stylesheet" href="/assets/benchmark.css?v=20261119" />
    <script type="module" src="/assets/benchmark.js?v=20261119"></script>
  </head>
  <body>
    <nav class="site-nav eval-nav" aria-label="Evaluaties">
      <span class="site-brand"
        ><img
          class="coa-symbol"
          src="/assets/coa-symbol.svg"
          width="40"
          height="40"
          alt=""
          aria-hidden="true"
        /><span>COA Assistent</span></span
      ><a href="/resultaten/">Evals</a
      ><a href="/benchmark/" aria-current="page">Benchmark</a>
    </nav>
    <main class="site-main benchmark-main">
      <header class="benchmark-heading">
        <h1>Benchmark</h1>
        <button id="edit-benchmark" type="button" hidden>
          Benchmark wijzigen
        </button>
      </header>
      <p id="page-status" role="status">Vragen laden…</p>
      <button id="retry-benchmarks" type="button" hidden>Opnieuw laden</button>
      <form id="benchmark-planner" aria-label="Benchmark starten" hidden>
        <div class="benchmark-field benchmark-question-field">
          <label for="benchmark-question">Vraag</label
          ><select id="benchmark-question"></select>
        </div>
        <div class="benchmark-question-controls">
          <div class="benchmark-field">
            <label for="benchmark-mode">Onderdeel</label
            ><select id="benchmark-mode">
              <option value="rag">Bronzoeken</option>
              <option value="assistant">COA-assistent</option>
            </select>
          </div>
          <div class="benchmark-field">
            <label for="benchmark-repeats">Herhalingen</label
            ><input
              id="benchmark-repeats"
              type="number"
              min="1"
              max="3"
              value="2"
              required
            />
          </div>
          <button
            id="start-benchmark"
            type="submit"
            class="benchmark-primary"
            disabled
          >
            Start benchmark
          </button>
        </div>
        <fieldset id="model-authorization" hidden>
          <legend>Modelgebruik</legend>
          <label class="benchmark-choice"
            ><input id="allow-models" type="checkbox" /><span
              >Modelgebruik toestaan</span
            ></label
          >
          <div class="benchmark-limit-fields">
            <div class="benchmark-field">
              <label for="model-attempts">Maximaal aantal modelpogingen</label
              ><input id="model-attempts" type="number" min="1" step="1" />
            </div>
            <div class="benchmark-field">
              <label for="model-seconds"
                >Maximale uitvoeringsduur (seconden)</label
              ><input id="model-seconds" type="number" min="1" step="1" />
            </div>
          </div>
          <p>Kosten onbekend.</p>
        </fieldset>
        <p id="plan-status" role="status"></p>
      </form>
      <section
        id="benchmark-history"
        hidden
        aria-label="Opgeslagen uitvoeringen"
      >
        <div class="benchmark-field">
          <label for="benchmark-run">Uitvoering</label
          ><select id="benchmark-run"></select>
        </div>
        <div id="history-question-field" class="benchmark-field" hidden>
          <label for="history-question">Vraag uit uitvoering</label
          ><select id="history-question"></select>
        </div>
      </section>
      <section id="benchmark-results" hidden aria-labelledby="run-question">
        <h2 id="run-question"></h2>
        <p id="run-context" class="site-caption"></p>
        <div class="benchmark-progress">
          <p id="run-status" role="status"></p>
          <div class="benchmark-run-actions">
            <button id="discuss-benchmark" type="button">
              Bespreek in Codex</button
            ><button id="stop-benchmark" type="button" hidden>
              Stop benchmark
            </button>
          </div>
        </div>
        <p id="handoff-status" role="status"></p>
        <div id="handoff-fallback" class="benchmark-field" hidden>
          <label for="codex-handoff">Terminalcommando</label
          ><textarea id="codex-handoff" readonly rows="5"></textarea>
        </div>
        <div id="benchmark-variants"></div>
      </section>
      <noscript
        >JavaScript is nodig om benchmarks uit te voeren en te
        vergelijken.</noscript
      >
    </main>
  </body>
</html>
